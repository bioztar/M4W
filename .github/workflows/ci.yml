name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build M4W.sln -c Release

      - name: Test
        run: dotnet test tests/M4W.Core.Tests -c Release --no-build

  release:
    # Only for version tags: publish the portable exe and attach it to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/M4W.App/M4W.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path publish/M4W.exe)) { throw "publish/M4W.exe missing" }
          Get-Item publish/M4W.exe | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/M4W.exe
          generate_release_notes: true
